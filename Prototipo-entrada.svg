rada</text><rect x="80" y="489" width="490" height="55" rx="6" fill="#f1f5f8" stroke="#a9bdcc"/><text x="96" y="524" font-size="19" fill="#304c60">29/10/2026 14:30</text><text x="620" y="475" font-size="17" fill="#25435a" font-weight="bold">Tarifa vigente</text><rect x="620" y="489" width="490" height="55" rx="6" fill="#f1f5f8" stroke="#a9bdcc"/><text x="636" y="524" font-size="19" fill="#304c60">R$ 12,00 / hora — exemplo</text><text x="80" y="580" font-size="17" fill="#25435a" font-weight="bold">Vaga sugerida</text><rect x="80" y="594" width="490" height="55" rx="6" fill="#f1f5f8" stroke="#a9bdcc"/><text x="96" y="629" font-size="19" fill="#304c60">Setor B • Corredor 04 • Vaga 023</text><text x="620" y="580" font-size="17" fill="#25435a" font-weight="bold">Identificador do atendimento</text><rect x="620" y="594" width="490" height="55" rx="6" fill="#f1f5f8" stroke="#a9bdcc"/><text x="636" y="629" font-size="19" fill="#304c60">Gerado após a confirmação</text><text x="80" y="700" font-size="16" fill="#466075">* Campos obrigatórios. Confira placa, veículo e tarifa antes de confirmar.</text><rect x="80" y="733" width="230" height="54" rx="6" fill="#087b74"/><text x="108" y="767" font-size="20" fill="white">Confirmar entrada</text><rect x="330" y="733" width="220" height="54" rx="6" fill="white" stroke="#7893a6"/><text x="360" y="767" font-size="20" fill="#304c60">Limpar campos</text><text x="80" y="862" font-size="16" fill="#466075">Maquete estática: não registra veículos nem controla vagas. Recibo disponível após confirmação.</text></g></svg>